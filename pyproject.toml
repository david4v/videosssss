[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "macdownloader"
version = "0.1.0"
description = "Local macOS-style GUI for downloading online videos with yt-dlp"
authors = [{name = "Videosssss"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.7",
    "yt-dlp>=2023.12.30",
]

[project.urls]
Homepage = "https://example.com"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
